[build]
  command = "wget -qO quarto.deb https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.42/quarto-1.6.42-linux-amd64.deb && mkdir -p /tmp/quarto-install && dpkg -x quarto.deb /tmp/quarto-install && export PATH=$PATH:/tmp/quarto-install/opt/quarto/bin && quarto render"
  publish = "_site"


